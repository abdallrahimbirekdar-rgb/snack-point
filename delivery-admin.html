<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>إدارة التوصيل — بلدنا</title><link rel="stylesheet" href="delivery.css"></head><body><header><a href="index.html">ماركت بلدنا</a></header><main><h1>إدارة التوصيل</h1><p id="notice" class="notice" role="status">أدخل مفتاح إدارة التوصيل لعرض الطلبات.</p><form id="login"><label>مفتاح الإدارة<input id="ownerKey" type="password" autocomplete="off" required></label><button>فتح الإدارة</button></form><div id="manager" hidden><button id="logout">إغلاق الإدارة</button><section><h2>المندوبون</h2><form id="addCourier"><label>اسم المندوب<input id="courierName" maxlength="80" required></label><button>إضافة مندوب</button></form><pre id="newKey" hidden></pre><div id="couriers"></div></section><section><h2>تعيين طلب</h2><p>انسخ رابط التتبّع الموجود في رسالة طلب الزبون، ثم اختر المندوب.</p><form id="assign"><label>رابط تتبّع الطلب<input id="trackingLink" type="url" required></label><label>المندوب<select id="courierSelect" required></select></label><button>تأكيد الطلب وتعيينه</button></form></section><section><h2>الطلبات</h2><button id="refresh">تحديث</button><div id="orders"></div></section></div></main><script src="tracking-config.js"></script><script src="delivery-admin.js"></script></body></html>
